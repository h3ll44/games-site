<style>

<style>
/* Layout: одна колонка-«досье» по центру экрана; каждый шаг игры — отдельный экран. Ночная операция: тёмный фон, бумажные карточки, красный штамп. */
:root {
  --night: #11151d;
  --panel: #1a202c;
  --line: #2b3343;
  --text: #e2e5ec;
  --muted: #8a92a6;
  --paper: #ebe6da;
  --paper-edge: #d4ccbb;
  --paper-muted: #6c675c;
  --ink: #1e1f24;
  --stamp: #d43c30;
  --stamp-soft: rgba(212, 60, 48, .14);
  --good: #5fb07a;
  --display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "PT Mono", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(120% 60% at 50% 0%, #1b2332 0%, var(--night) 60%);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.app {
  max-width: 460px; min-height: 100%; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  display: flex; flex-direction: column;
}
.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; }

/* шапка */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.brand-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .name { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brand .case { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text);
  font: 500 14px var(--body); cursor: pointer;
}
h1 { font-family: var(--display); font-size: clamp(38px, 13vw, 58px); line-height: .95; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 .dot { color: var(--stamp); }
h2 { font-family: var(--display); font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; max-width: 36ch; }

/* меню игр */
.games { display: grid; gap: 10px; }
.game {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  color: var(--text); text-align: left; cursor: pointer; font: inherit;
}
.game .ico { font-size: 28px; line-height: 1; text-align: center; }
.game b { display: block; font-size: 17px; }
.game small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
.game .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.foot { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }

/* настройки */
.fields > .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); }
.fields > .field:last-child { border-bottom: 1px solid var(--line); }
.field .label { font-weight: 500; }
.field small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.field.stack { flex-direction: column; align-items: stretch; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 22px; line-height: 1; cursor: pointer; }
.stepper output { min-width: 2.4ch; text-align: center; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); padding: 8px 14px; font: 500 14px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--night); border-color: var(--text); }
textarea { width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 15px/1.45 var(--body); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.hint.err { color: var(--stamp); }

/* кнопки */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 14px; border: 0; cursor: pointer; font: 700 17px var(--body); background: var(--stamp); color: #fff; padding: 0 20px; text-align: center; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.quiet { background: var(--panel); color: var(--text); }
.btn.good { background: var(--good); color: #0e1a12; }
.btn.small { min-height: 46px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn:focus-visible, .back:focus-visible, .game:focus-visible, .stepper button:focus-visible, .seg button:focus-visible, textarea:focus-visible, .pick:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
.spacer { flex: 1; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.col { display: grid; gap: 10px; }

/* имена игроков */
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.names input { width: 100%; box-sizing: border-box; min-height: 44px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 15px var(--body); }
.names input:focus-visible { outline: 2px solid var(--stamp); outline-offset: 1px; }
.cover .who.nm { font-size: clamp(42px, 15vw, 86px); line-height: 1; overflow-wrap: anywhere; text-wrap: balance; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; }
.scores span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.scores span.now { border-color: var(--text); color: var(--text); }

/* обложка: передайте телефон */
.cover { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.cover .eyebrow, .eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cover .who { font-family: var(--display); font-size: clamp(72px, 30vw, 132px); line-height: .9; font-variant-numeric: tabular-nums; }
.cover .who span { font-size: .3em; color: var(--muted); }
.cover p { margin: 0; color: var(--muted); max-width: 32ch; }

/* карточка-досье */
.card-wrap { flex: 1; display: flex; align-items: center; perspective: 1200px; padding-top: 14px; }
.card {
  position: relative; width: 100%; box-sizing: border-box;
  background: var(--paper); color: var(--ink); border-radius: 6px; padding: 26px 22px 28px;
  box-shadow: 0 1px 0 var(--paper-edge), 0 24px 60px rgba(0,0,0,.45);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(30,31,36,.06) 31px 32px);
  animation: flip .5s cubic-bezier(.2,.7,.2,1);
}
@keyframes flip { from { transform: rotateY(-90deg); opacity: .4; } to { transform: rotateY(0); opacity: 1; } }
.card .meta { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--paper-muted); }
.card .k { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--paper-muted); margin: 20px 0 4px; }
.card .v { font-family: var(--display); font-size: clamp(24px, 8vw, 34px); line-height: 1.05; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.card .v.role { font-family: var(--body); font-weight: 700; font-size: 22px; }
.card .note { font-family: var(--mono); font-size: 14px; margin: 22px 0 0; color: #3b3a36; }
.card .traits { display: grid; gap: 10px; margin-top: 16px; }
.card .traits div { display: grid; gap: 1px; padding-bottom: 8px; border-bottom: 1px dashed rgba(30,31,36,.18); }
.card .traits span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper-muted); }
.card .traits b { font-size: 16px; line-height: 1.3; }
.card .big-word { font-family: var(--display); font-size: clamp(34px, 12vw, 54px); line-height: 1; margin: 26px 0 10px; text-align: center; overflow-wrap: anywhere; text-wrap: balance; }
.stamp { position: absolute; right: 14px; top: -16px; background: var(--paper); font-family: var(--display); font-size: 15px; letter-spacing: .08em; color: var(--stamp); border: 3px solid var(--stamp); border-radius: 4px; padding: 4px 8px; transform: rotate(-9deg); opacity: .9; }
.card.alt { background-color: #e9e1d1; }
.card.alt .v { color: var(--stamp); }
.redact { display: inline-block; background: var(--ink); color: transparent; border-radius: 2px; user-select: none; }

/* панели */
.panel { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.panel p { margin: 0; }
.first { display: flex; gap: 14px; align-items: center; }
.first .n { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.first small, .panel small { color: var(--muted); display: block; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; font-weight: 500; }

/* таймер */
.timer { display: grid; place-items: center; padding-block: 6px; }
.timer svg { width: min(64vw, 240px); height: auto; max-width: 100%; display: block; }
.timer .track { fill: none; stroke: var(--line); stroke-width: 10; }
.timer .bar { fill: none; stroke: var(--stamp); stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .4s linear; }
.timer .clock { fill: var(--text); font-family: var(--display); font-size: 40px; font-variant-numeric: tabular-nums; }
.timer .sub { fill: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; }
.timer.done .bar { stroke: var(--muted); }

/* раскрывашки */
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; padding-block: 14px; font-weight: 500; display: flex; justify-content: space-between; gap: 10px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--muted); font-family: var(--mono); }
details[open] summary::after { content: "−"; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 16px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.rules { margin: 0; padding: 0 0 16px 20px; color: var(--muted); display: grid; gap: 8px; }
.rules b { color: var(--text); font-weight: 500; }
.prose { color: var(--muted); padding-bottom: 16px; }
.prose b { color: var(--text); font-weight: 500; }

.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.pick { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 12px; text-align: left; font: inherit; cursor: pointer; }
.pick small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.pick[aria-pressed="true"] { border-color: var(--good); background: rgba(95,176,122,.14); }

/* подтверждение, итог, эпилог */
.confirm { border: 1px solid var(--stamp); background: var(--stamp-soft); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.confirm p { margin: 0; }
.result .big { font-family: var(--display); font-size: clamp(28px, 10vw, 40px); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere; }

.story { display: grid; gap: 10px; }

.score { font-family: var(--display); font-size: 44px; line-height: 1; }

.choices .btn { justify-content: flex-start; text-align: left; font-weight: 500; font-size: 16px; padding: 12px 18px; min-height: 52px; line-height: 1.3; }
.event { font-size: 18px; line-height: 1.45; margin: 0; }

.stage { position: fixed; inset: 0; z-index: 20; background: var(--night); overflow: hidden; }

  position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box;

.st-top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.st-top .name { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.st-title { flex: 1; font-family: var(--mono); font-size: 13px; letter-spacing: .08em; color: var(--text); text-align: center; }
.st-clock { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.st-rot { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 20px; cursor: pointer; }
.st-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(110px, 22%) 1fr minmax(130px, 25%); gap: 14px; }

.st-side .btn { height: 100%; min-height: 0; font-size: 16px; padding: 8px 12px; }
.st-side .st-ok { font-size: 22px; }
.st-word { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.st-word .w { font-family: var(--display); font-size: clamp(32px, 15vmin, 110px); line-height: 1; overflow-wrap: anywhere; text-wrap: balance; }
.st-word p { margin: 0; color: var(--muted); font-size: 14px; }
.st-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.st-bar i { display: block; height: 100%; background: var(--stamp); transition: width .4s linear; }
.st-confirm { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(17,21,29,.85); z-index: 2; }
.st-confirm .confirm { max-width: 420px; background: var(--panel); }
.st-rot:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .st-bar i { transition: none; }
  .card { animation: none; }
  .timer .bar, .meter i { transition: none; }
}
</style>

    <button class="btn" type="button" id="who-start">Слово на лоб</button>`;
  const vWhoPlay = () => `
    <div class="stage${who.flip ? " flip" : ""}"><div class="stage-in">
      <div class="st-top">
        <button class="back" type="button" id="back">← Назад</button>
        <span class="name">H3LL44 GAMES</span>
        <span class="st-title">Кто я? · ${esc(who.roster[who.turn])}</span>
        <span class="st-clock" id="sclock">${fmt(T.left)}</span>
        <button class="st-rot" type="button" id="who-rot" aria-label="Перевернуть экран">⟲</button>
      </div>
      <div class="st-main">
        <div class="st-side">
          <button class="btn quiet" type="button" id="who-skip">🔄 Другое слово</button>
          <button class="btn ghost" type="button" id="who-fail">🏳 Сдаюсь</button>
        </div>
        <div class="st-word"><div class="w">${esc(who.word.toUpperCase())}</div>
          <p>Задавай вопросы «да/нет» — друзья отвечают</p></div>
        <div class="st-side"><button class="btn good st-ok" type="button" id="who-ok">✓ Угадал!</button></div>
      </div>
      <div class="st-bar"><i id="sbar" style="width:${100 * T.left / (T.total || 1)}%"></i></div>
      ${S.confirm ? `<div class="st-confirm"><div class="confirm"><p>${esc(S.confirm.text)}</p>
        <div class="row"><button class="btn" type="button" id="cf-yes">Да</button>
        <button class="btn ghost" type="button" id="cf-no">Отмена</button></div></div></div>` : ""}
    </div></div>`;
  const vWhoRes = () => `${head("Кто я?")}
    <div class="result"><section><div class="lbl">${esc(who.roster[who.turn])}: ${who.result === "ok" ? "🎉 угадал(а)!" : who.result === "time" ? "⏰ время вышло" : "🏳 сдался(ась)"}</div>
      <p class="big">${esc(who.word)}</p></section></div>
    <div class="spacer"></div>
    <button class="btn" type="button" id="who-next">Следующий игрок</button>`;
  const whoEnd = r => { timerStop(); unlockOrientation(); who.result = r; if (r === "ok") { who.guessed++; who.scores[who.turn]++; } go("who:res"); };

  // ================================================================ ВЫЖИВАНИЕ
  const SV = D.surv;
  const sets = { MEDIC: new Set(D.epi.MEDIC), FOOD: new Set(D.epi.FOOD), TECH: new Set(D.epi.TECH), GUARD: new Set(D.epi.GUARD) };
  let sv = null;
  const svHas = part => sv.items.find(it => it.toLowerCase().includes(part.toLowerCase()));
  const svMed = () => SV.med.map(svHas).find(Boolean);
  const svFill = t => t.replace("{hobby}", sv.card.hobby.toLowerCase()).replace("{phobia}", sv.card.phobia.replace(/\s*\(.*\)/, "").toLowerCase());
  function svNew() {
    const card = genCards(1)[0];
    sv = { card, cat: pick(D.catastrophes), hp: 100, food: SV.food, water: SV.water, mood: 80, day: 1, items: [card.baggage],
      used: new Set(), event: null, log: [], cause: "", over: false, notes: [], showInv: false };
    sv.prof = card.profession.split(" (")[0];
    const sev = card.health.match(/тяжесть (\d+)%/); if (sev) sv.hp = 100 - Math.floor(+sev[1] / 2);
    if (sets.FOOD.has(sv.prof)) sv.food += 2;
    if (svHas("консерв")) sv.food += 4;
    if (svHas("картошк")) sv.food += 3;
  }
  function svEvent() {
    if (sv.day % SV.quietEvery === 0) return SV.quiet;
    let free = SV.events.filter(e => !sv.used.has(e.id));
    if (!free.length) { sv.used.clear(); free = SV.events; }
    const e = pick(free); sv.used.add(e.id); return e;
  }
  function svChance(opt) {
    let p = opt.p ?? 1; if (p >= 1) return 1;
    const tags = new Set(Object.keys(sets).filter(k => sets[k].has(sv.prof)).map(k => k.toLowerCase()));
    for (const [k, add] of Object.entries(opt.bonus || {})) if ((k.startsWith("item:") && svHas(k.slice(5))) || tags.has(k)) p += add;
    return Math.min(p, .95);
  }
  function svChoose(idx) {
    const opt = sv.event.choices[idx];
    const out = (Math.random() < svChance(opt) || !opt.lose) ? opt.win : opt.lose;
    const notes = [svFill(out.t)];
    sv.hp = Math.min(100, sv.hp + (out.hp || 0)); sv.food = Math.max(0, sv.food + (out.food || 0));
    sv.water = Math.max(0, sv.water + (out.water || 0)); sv.mood = Math.max(0, Math.min(100, sv.mood + (out.mood || 0)));
    if (out.add) { sv.items.push(out.add); notes.push(`🎒 Получено: ${out.add}`); }
    if ((out.hp || 0) < 0) sv.cause = out.t;
    if (sv.event !== SV.quiet && ((out.hp || 0) <= -15 || out.add || (out.mood || 0) >= 15 || (out.food || 0) >= 4)) sv.log.push(`День ${sv.day}: ${svFill(out.t)}`);
    // конец дня
    if (sv.food > 0) sv.food--; else { sv.hp -= SV.hunger; sv.cause = "Голод оказался сильнее."; notes.push(`🍖 Еды нет — вы слабеете от голода (−${SV.hunger} ❤️).`); }
    if (sv.water > 0) sv.water--; else { sv.hp -= SV.thirst; sv.cause = "Без воды долго не протянуть."; notes.push(`💧 Воды нет — жажда отнимает силы (−${SV.thirst} ❤️).`); }
    sv.mood = Math.max(0, sv.mood - 3);
    if (sv.mood === 0) { sv.hp -= 10; sv.cause = "Отчаяние сломило волю к жизни."; notes.push("🧠 Рассудок на нуле — отчаяние подтачивает здоровье (−10 ❤️)."); }
    if (svHas("Пёс")) sv.mood = Math.min(100, sv.mood + 2);
    if (sv.food && sv.water && sv.mood >= 40 && sv.hp > 0 && sv.hp < 100) sv.hp = Math.min(100, sv.hp + SV.regen);
    sv.notes = notes;
    if (sv.hp <= 0) { sv.over = true; sv.won = false; }
    else { sv.day++; sv.event = null; if (sv.day > SV.win) { sv.over = true; sv.won = true; } }
    if (sv.over) {
      const days = sv.won ? SV.win : sv.day, best = store.get("surv-best", 0);
      sv.newBest = days > best; sv.best = Math.max(best, days); store.set("surv-best", sv.best);
      go("surv:end");
    } else render();
  }
  const vSurvIntro = () => {
    const keys = Object.keys(D.traits).filter(k => k !== "character" && k !== "fact");
    return `${head("Выживание")}
    <h1>Выживание<span class="dot">.</span></h1>
    <span class="eyebrow">${esc(sv.cat[0])}</span>
    <p class="lead" style="color:var(--text)">${esc(sv.cat[1])}</p>
    <p class="lead">Вы успели спрятаться в убежище. Продержитесь ${SV.win} дней — и за вами придут спасатели.</p>
    <article class="card"><div class="meta"><span>Ваш персонаж</span><span>Рекорд: ${store.get("surv-best", 0)} дн.</span></div>
      <div class="traits">${keys.map(k => `<div><span>${esc(D.traits[k].replace(/^\S+\s/, ""))}</span><b>${esc(sv.card[k])}</b></div>`).join("")}</div>
      <p class="note">Профессия и багаж влияют на шансы: инженер лучше чинит, врач лечит, военный отбивается.</p></article>
    <button class="btn" type="button" id="surv-go">Начать</button>`;
  };
  const meter = (ico, v, cls = "") => `<div class="stat"><span>${ico}</span><div class="meter ${cls}"><i style="width:${Math.max(0, v)}%"></i></div><span>${Math.max(0, v)}</span></div>`;
  const vSurvDay = () => {
    sv.event = sv.event || svEvent();
    const med = sv.hp < 100 && svMed();
    return `${head(`День ${sv.day} из ${SV.win}`)}
    <div class="panel stats">${meter("❤️", sv.hp)}${meter("🧠", sv.mood, "mood")}
      <div class="supplies"><span>🍖 Еда: ${sv.food}</span><span>💧 Вода: ${sv.water}</span></div></div>
    ${sv.notes.length ? `<div class="notes">${sv.notes.map(n => `<p>${esc(n)}</p>`).join("")}</div>` : ""}
    <p class="event">${esc(svFill(sv.event.text))}</p>
    <div class="choices">${sv.event.choices.map((c, i) => `<button class="btn quiet" type="button" data-choice="${i}">${esc(svFill(c.label))}</button>`).join("")}</div>
    ${med ? `<button class="btn ghost small" type="button" id="surv-med">💊 Использовать: ${esc(med)} (+30 ❤️)</button>` : ""}
    <details${sv.showInv ? " open" : ""} id="surv-inv"><summary>🎒 Персонаж и рюкзак</summary>
      <div class="prose"><b>${esc(sv.card.profession)}</b>, ${esc(sv.card.biology.toLowerCase())}<br>
      Здоровье: ${esc(sv.card.health)}<br>Хобби: ${esc(sv.card.hobby)}<br>Фобия: ${esc(sv.card.phobia)}<br>
      Рюкзак: ${esc(sv.items.join(", ") || "пусто")}</div></details>`;
  };
  const vSurvEnd = () => `${head("Выживание · итог")}
    ${sv.notes.length ? `<div class="notes">${sv.notes.map(n => `<p>${esc(n)}</p>`).join("")}</div>` : ""}
    <h2>${sv.won ? `🚁 День ${SV.win}. Спасение!` : `💀 День ${sv.day}. Конец пути.`}</h2>
    <p class="lead" style="color:var(--text)">${sv.won ? "По радио раздался голос: «Всем, кто нас слышит, — эвакуация у старой станции». Вы выбрались наружу и увидели солнце." : esc(sv.cause || "Силы кончились.")}</p>
    <div class="panel col"><span class="eyebrow">📖 Ваша история</span>
      <p>${esc(sv.prof)}, ${esc(sv.card.biology.toLowerCase())}. Катастрофа: ${esc(sv.cat[0])}.</p>
      <div class="story">${(sv.log.slice(-6).map(m => `<p>• ${esc(m)}</p>`).join("")) || "<p>• Дни тянулись однообразно.</p>"}</div></div>
    <div class="panel col"><small>Прожито дней</small><span class="score">${sv.won ? SV.win : sv.day}</span>
      <p>${sv.newBest ? "🏆 Новый рекорд!" : `Ваш рекорд: ${sv.best} дн.`}</p></div>
    <button class="btn" type="button" id="surv-new">Ещё раз</button>
    <button class="btn ghost" type="button" id="to-menu">В меню</button>`;

  // ================================================================ МЕНЮ
  const GAMES = {
    bunker: { title: "Бункер", ico: "🏚", desc: "Убеди всех, что ты нужен в бункере", meta: "4–16", start: () => go("bunker:setup") },
    spy: { title: "Шпион", ico: "🕵️", desc: "Вычисли того, кто не знает локацию", meta: "3–12", start: () => go("spy:setup") },
    croc: { title: "Крокодил", ico: "🐊", desc: "Покажи слово жестами", meta: "2+", start: () => go("croc:setup") },
    who: { title: "Кто я?", ico: "🎭", desc: "Телефон на лоб — угадай, кто ты", meta: "2+", start: () => go("who:setup") },
    mafia: { title: "Мафия", ico: "🌙", desc: "Раздача ролей и шпаргалка ведущему", meta: "4–16", start: () => go("mafia:setup") },
    surv: { title: "Выживание", ico: "☢️", desc: "Продержись 30 дней в одиночку", meta: "1", start: () => { svNew(); go("surv:intro"); } },
  };
  const vMenu = () => `${head("Офлайн-игры", false)}
    <h1>H3LL44<br>GAMES<span class="dot">.</span></h1>
    <p class="lead">Игры для компании на одном телефоне. Выберите игру — телефон пойдёт по кругу.</p>
    <div class="games">${Object.entries(GAMES).map(([k, g]) => `
      <button class="game" type="button" data-game="${k}"><span class="ico">${g.ico}</span>
        <span><b>${g.title}</b><small>${g.desc}</small></span><span class="meta">${g.meta}</span></button>`).join("")}</div>
    <p class="foot">Игры в группе, статистика и рейтинг — в боте H3LL44 GAMES.</p>`;

  // ================================================================ маршруты
  const ROUTES = {
    "menu": { view: vMenu },
    "deal:cover": { view: vDealCover, back: () => DEAL.i === 0 ? go(DEAL.game + ":setup") : abortDeal() },
    "deal:card": { view: vDealCard, back: () => go("deal:cover") },
    "spy:setup": { view: vSpySetup, back: () => go("menu") },
    "spy:hub": { view: vSpyHub, back: () => ask("Выйти в настройки? Текущая игра закончится.", () => { timerStop(); go("spy:setup"); }) },
    "spy:end": { view: vSpyEnd, back: () => go("spy:setup") },
    "bunker:setup": { view: vBunkerSetup, back: () => go("menu") },
    "bunker:sc": { view: vBunkerSc, back: () => ask("Выйти в настройки? Текущая игра закончится.", () => go("bunker:setup")) },
    "bunker:pick": { view: vBunkerPick, back: () => go("bunker:sc") },
    "bunker:epi": { view: vBunkerEpi, back: () => go("bunker:pick") },
    "mafia:setup": { view: vMafiaSetup, back: () => go("menu") },
    "mafia:hub": { view: vMafiaHub, back: () => ask("Выйти в настройки? Текущая игра закончится.", () => go("mafia:setup")) },
    "croc:setup": { view: vCrocSetup, back: () => go("menu") },
    "croc:cover": { view: vCrocCover, back: () => go("croc:setup") },
    "croc:word": { view: vCrocWord, back: () => go("croc:cover") },
    "croc:play": { view: vCrocPlay, back: () => ask("Прервать раунд?", () => crocEnd("fail")) },
    "croc:res": { view: vCrocRes, back: () => go("croc:cover") },
    "who:setup": { view: vWhoSetup, back: () => go("menu") },
    "who:cover": { view: vWhoCover, back: () => go("who:setup") },
    "who:play": { view: vWhoPlay, back: () => ask("Прервать ход?", () => whoEnd("fail")) },
    "who:res": { view: vWhoRes, back: () => go("who:cover") },
    "surv:intro": { view: vSurvIntro, back: () => go("menu") },
    "surv:day": { view: vSurvDay, back: () => ask("Выйти? Прогресс этой игры пропадёт.", () => go("menu")) },
    "surv:end": { view: vSurvEnd, back: () => go("menu") },
  };
  const back = () => { const r = ROUTES[S.route]; if (r && r.back) r.back(); };

  function render() {
    app.innerHTML = `<main class="screen">${ROUTES[S.route].view()}</main>`;
    bind();
    try { const b = window.Telegram?.WebApp?.BackButton; if (b) S.route === "menu" ? b.hide() : b.show(); } catch {}
  }

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function bindStepper(id, obj, key, min, max, step, storeKey) {
    on(id + "-m", () => { obj[key] = clamp(obj[key] - step, min, max); store.set(storeKey, obj[key]); render(); });
    on(id + "-p", () => { obj[key] = clamp(obj[key] + step, min, max); store.set(storeKey, obj[key]); render(); });
  }

  function bind() {
    on("back", back);
    on("cf-yes", () => { const f = S.confirm.yes; S.confirm = null; f(); });
    on("cf-no", () => { S.confirm = null; render(); });
    on("to-menu", () => go("menu"));
    document.querySelectorAll("[data-game]").forEach(b => b.addEventListener("click", () => GAMES[b.dataset.game].start()));
    // имена игроков
    document.querySelectorAll("[data-nm]").forEach(inp => inp.addEventListener("input", () => {
      NAMES[+inp.dataset.nm] = inp.value; store.set("names", NAMES); }));
    // раздача
    on("open", () => go("deal:card"));
    on("hide", () => { DEAL.i++; DEAL.i < DEAL.n ? go("deal:cover") : DEAL.done(); });
    // шпион
    bindStepper("sp", spy, "players", 3, 12, 1, "spy-players");
    bindStepper("sm", spy, "minutes", 3, 15, 1, "spy-minutes");
    on("spy-deal", spyDeal);
    on("t-toggle", () => { T.running ? timerStop() : timerStart(); render(); });
    on("t-reset", () => { timerStop(); T.left = T.total; render(); });
    on("spy-rev", () => { spy.reveal = true; render(); });
    on("spy-rev-no", () => { spy.reveal = false; render(); });
    on("spy-rev-yes", () => { timerStop(); go("spy:end"); });
    const st = document.getElementById("spy-text");
    if (st) st.addEventListener("input", () => { spy.customText = st.value; store.set("spy-text", st.value);
      document.getElementById("spy-hint").textContent = `Каждая локация с новой строки. Сейчас: ${parseList(st.value).length}, нужно минимум 5. Ролей у своих локаций нет.`; });
    // бункер
    bindStepper("bp", bunker, "players", 4, 16, 1, "bunker-players");
    on("bunker-deal", bunkerDeal);
    on("bunker-finish", () => go("bunker:pick"));
    document.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.pick; bunker.chosen.has(i) ? bunker.chosen.delete(i) : bunker.chosen.add(i); render(); }));
    on("bunker-epi", () => { bunkerEpi = epilogue([...bunker.chosen].sort((a, b) => a - b).map(i => [bunker.names[i], bunker.cards[i]]), bunker.sc); go("bunker:epi"); });
    on("bunker-new", bunkerDeal);
    // мафия
    bindStepper("mp", mafia, "players", 4, 16, 1, "mafia-players");
    on("mafia-deal", mafiaDeal);
    on("mafia-show", () => ask("Показать все роли? Убедитесь, что экран видит только ведущий.", () => { mafia.show = true; render(); }));
    on("mafia-hide", () => { mafia.show = false; render(); });
    // слова
    document.querySelectorAll("[data-seg]").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.v;
      if (b.dataset.seg === "spyset") { spy.custom = v === "own"; store.set("spy-custom", spy.custom); }
      if (b.dataset.seg === "lvl") { words.level = v; store.set("words-level", v); }
      S.error = ""; render();
    }));
    const wt = document.getElementById("words-text");
    if (wt) wt.addEventListener("input", () => { words.custom = wt.value; store.set("words-text", wt.value);
      document.getElementById("words-hint").textContent = `Через запятую или с новой строки. Сейчас: ${parseList(wt.value).length}, нужно минимум 10. Общие для Крокодила и «Кто я?».`; });
    // крокодил
    bindStepper("ct", croc, "time", 30, 180, 10, "croc-time");
    on("croc-go", () => { if (!checkWords()) return; croc.used = new Set(); croc.guessed = croc.rounds = 0; go("croc:cover"); });
    on("croc-show", () => { croc.word = nextWord(croc); go("croc:word"); });
    on("croc-other", () => { croc.word = nextWord(croc); render(); });
    on("croc-start", () => { croc.rounds++; croc.peek = false; timerSet(croc.time, () => crocEnd("time")); go("croc:play"); timerStart(); });
    on("croc-ok", () => crocEnd("ok"));
    on("croc-fail", () => crocEnd("fail"));
    on("croc-peek", () => { croc.peek = !croc.peek; const b = document.getElementById("croc-peek"); b.textContent = croc.peek ? croc.word : "👀 Подсмотреть"; });
    on("croc-next", () => go("croc:cover"));
    // кто я
    bindStepper("wt", who, "time", 30, 300, 30, "who-time");
    bindStepper("wp", who, "players", 2, 20, 1, "who-players");
    on("who-go", () => { if (!checkWords()) return; who.used = new Set(); who.guessed = who.rounds = 0;
      who.roster = roster(who.players); who.scores = who.roster.map(() => 0); who.turn = 0; go("who:cover"); });
    on("who-start", () => { who.rounds++; who.word = nextWord(who); timerSet(who.time, () => whoEnd("time")); lockLandscape(); go("who:play"); timerStart(); });
    on("who-rot", () => { who.flip = !who.flip; store.set("who-flip", who.flip); render(); });
    on("who-skip", () => { who.word = nextWord(who); render(); paintTimer(); });
    on("who-ok", () => whoEnd("ok"));
    on("who-fail", () => whoEnd("fail"));
    on("who-next", () => { who.turn = (who.turn + 1) % who.roster.length; go("who:cover"); });
    // выживание
    on("surv-go", () => go("surv:day"));
    on("surv-new", () => { svNew(); go("surv:intro"); });
    document.querySelectorAll("[data-choice]").forEach(b => b.addEventListener("click", () => svChoose(+b.dataset.choice)));
    on("surv-med", () => { const m = svMed(); if (!m) return; sv.items.splice(sv.items.indexOf(m), 1); sv.hp = Math.min(100, sv.hp + 30);
      sv.notes = [`💊 Вы использовали «${m}». Стало легче (+30 ❤️).`]; render(); });
    const inv = document.getElementById("surv-inv");
    if (inv) inv.addEventListener("toggle", () => { sv.showInv = inv.open; });
  }

  // ---------------------------------------------------------------- запуск
  try {
    const tg = window.Telegram?.WebApp;
    tg?.ready(); tg?.expand(); tg?.BackButton?.onClick(back);
  } catch {}
  // прямая ссылка на игру: ...?game=spy или ...#spy
  let startGame = "";
  try { startGame = new URLSearchParams(location.search).get("game") || location.hash.slice(1).split("&")[0]; } catch {}
  if (GAMES[startGame]) GAMES[startGame].start(); else render();
})();
</script>
</body>
</html>
