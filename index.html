<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name Games: Шпион</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Golos+Text:wght@400;500;700&family=PT+Mono&display=swap">
<!-- Telegram Mini App: даёт доступ к кнопке «назад», разворачиванию и т.п. Вне Telegram ничего не делает. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: одна колонка-«досье» по центру экрана, каждый шаг игры — отдельный экран. Ночная операция: тёмный фон, бумажная карточка, красный штамп. */
:root {
  --night: #11151d;
  --panel: #1a202c;
  --line: #2b3343;
  --text: #e2e5ec;
  --muted: #8a92a6;
  --paper: #ebe6da;
  --paper-edge: #d4ccbb;
  --ink: #1e1f24;
  --stamp: #d43c30;
  --stamp-soft: rgba(212, 60, 48, .14);
  --display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "PT Mono", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(120% 60% at 50% 0%, #1b2332 0%, var(--night) 60%);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.app {
  max-width: 460px;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-sizing: border-box;
}
.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; }

/* шапка */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand .name { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brand-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text);
  font: 500 14px var(--body); cursor: pointer;
}
.back:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
.brand { align-items: center; }
.brand .case { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
h1 {
  font-family: var(--display);
  font-size: clamp(44px, 15vw, 64px);
  line-height: .95;
  margin: 0;
  letter-spacing: .02em;
  text-wrap: balance;
}
h1 .dot { color: var(--stamp); }
.lead { color: var(--muted); margin: 0; max-width: 34ch; }

/* блоки настроек */
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); }
.field:last-of-type { border-bottom: 1px solid var(--line); }
.field label, .field .label { font-weight: 500; }
.field small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-size: 22px; line-height: 1; cursor: pointer;
}
.stepper output { min-width: 2.2ch; text-align: center; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 10px 14px; font: 500 14px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--night); }
textarea {
  width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; font: 15px/1.45 var(--body);
}
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.hint.err { color: var(--stamp); }

/* кнопки */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; border-radius: 14px; border: 0; cursor: pointer;
  font: 700 17px var(--body); letter-spacing: .01em;
  background: var(--stamp); color: #fff; padding: 0 20px;
}
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.quiet { background: var(--panel); color: var(--text); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .stepper button:focus-visible, .seg button:focus-visible, textarea:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--stamp); outline-offset: 2px;
}
.spacer { flex: 1; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* обложка: передайте телефон */
.cover { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: left; }
.cover .eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cover .who { font-family: var(--display); font-size: clamp(72px, 30vw, 132px); line-height: .9; font-variant-numeric: tabular-nums; }
.cover .who span { font-size: .3em; color: var(--muted); }
.cover p { margin: 0; color: var(--muted); max-width: 30ch; }

/* карточка-досье */
.card-wrap { flex: 1; display: flex; align-items: center; perspective: 1200px; }
.card {
  position: relative; width: 100%;
  background: var(--paper); color: var(--ink);
  border-radius: 6px; padding: 26px 22px 30px;
  box-shadow: 0 1px 0 var(--paper-edge), 0 24px 60px rgba(0,0,0,.45);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(30,31,36,.06) 31px 32px);
  animation: flip .5s cubic-bezier(.2,.7,.2,1);
  transform-origin: center;
}
@keyframes flip { from { transform: rotateY(-90deg); opacity: .4; } to { transform: rotateY(0); opacity: 1; } }
.card .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #6c675c; }
.card .k { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6c675c; margin: 22px 0 4px; }
.card .v { font-family: var(--display); font-size: clamp(26px, 8.5vw, 36px); line-height: 1.05; margin: 0; text-wrap: balance; }
.card .v.role { font-family: var(--body); font-weight: 700; font-size: 22px; }
.card .note { font-family: var(--mono); font-size: 14px; margin: 24px 0 0; color: #3b3a36; }
.stamp {
  position: absolute; right: 14px; top: -16px;
  background: var(--paper);
  font-family: var(--display); font-size: 15px; letter-spacing: .08em;
  color: var(--stamp); border: 3px solid var(--stamp); border-radius: 4px;
  padding: 4px 8px; transform: rotate(-9deg); opacity: .85;
}
.card.spy { background-color: #e9e1d1; }
.card.spy .v { color: var(--stamp); font-size: clamp(34px, 11vw, 46px); }
.redact { display: inline-block; background: var(--ink); color: transparent; border-radius: 2px; user-select: none; }

/* штаб: таймер и локации */
.first { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.first .n { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.first p { margin: 0; }
.first small { color: var(--muted); display: block; }
.timer { display: grid; place-items: center; padding-block: 6px; }
.timer svg { width: min(68vw, 250px); height: auto; max-width: 100%; display: block; }
.timer .track { fill: none; stroke: var(--line); stroke-width: 10; }
.timer .bar { fill: none; stroke: var(--stamp); stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .4s linear; }
.timer .clock { fill: var(--text); font-family: var(--display); font-size: 40px; font-variant-numeric: tabular-nums; }
.timer .sub { fill: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; }
.timer.done .bar { stroke: var(--muted); }
details { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
summary { cursor: pointer; padding-block: 14px; font-weight: 500; display: flex; justify-content: space-between; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--muted); font-family: var(--mono); }
details[open] summary::after { content: "−"; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 16px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; background: transparent; color: var(--text); }
.rules { margin: 0; padding: 0 0 16px 20px; color: var(--muted); display: grid; gap: 8px; }
.rules b { color: var(--text); font-weight: 500; }

/* подтверждение и итог */
.confirm { border: 1px solid var(--stamp); background: var(--stamp-soft); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.confirm p { margin: 0; }
.result .big { font-family: var(--display); font-size: clamp(30px, 10vw, 42px); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; }
.result .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.result section { padding-block: 16px; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .timer .bar { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // Локации и роли — те же, что в боте (modes/spy_data.py)
  const LOCATIONS = {
    "Больница": ["Хирург", "Медсестра", "Пациент", "Главврач", "Санитар", "Анестезиолог", "Посетитель"],
    "Школа": ["Учитель", "Ученик-отличник", "Директор", "Завуч", "Охранник", "Повар в столовой", "Двоечник"],
    "Самолёт": ["Пилот", "Стюардесса", "Пассажир бизнес-класса", "Ребёнок", "Турист", "Бортмеханик", "Пассажир с собакой"],
    "Круизный лайнер": ["Капитан", "Бармен", "Пенсионер-турист", "Аниматор", "Кок", "Молодожёны", "Музыкант"],
    "Космическая станция": ["Командир", "Инженер", "Учёный", "Космический турист", "Врач", "Пилот", "Инопланетянин"],
    "Пиратский корабль": ["Капитан", "Кок", "Юнга", "Пленник", "Штурман", "Канонир", "Попугай"],
    "Казино": ["Крупье", "Охранник", "Хайроллер", "Официантка", "Шулер", "Директор", "Новичок"],
    "Банк": ["Кассир", "Управляющий", "Охранник", "Грабитель", "Клиент", "Инкассатор", "Консультант"],
    "Цирк": ["Клоун", "Акробат", "Дрессировщик", "Фокусник", "Зритель", "Жонглёр", "Директор цирка"],
    "Ресторан": ["Шеф-повар", "Официант", "Критик", "Посетитель", "Сомелье", "Посудомойщик", "Администратор"],
    "Полицейский участок": ["Следователь", "Дежурный", "Задержанный", "Адвокат", "Журналист", "Свидетель", "Кинолог"],
    "Пляж": ["Спасатель", "Отдыхающий", "Продавец кукурузы", "Сёрфер", "Фотограф", "Ребёнок с ведёрком", "Массажист"],
    "Театр": ["Актёр", "Режиссёр", "Зритель", "Суфлёр", "Гардеробщица", "Костюмер", "Осветитель"],
    "Супермаркет": ["Кассир", "Охранник", "Покупатель", "Грузчик", "Мерчендайзер", "Директор", "Промоутер"],
    "Военная база": ["Генерал", "Рядовой", "Повар", "Медик", "Снайпер", "Связист", "Новобранец"],
    "Поезд": ["Машинист", "Проводник", "Пассажир с курицей", "Студент", "Командировочный", "Контролёр", "Продавец в вагоне-ресторане"],
    "Отель": ["Портье", "Горничная", "Турист", "Швейцар", "Управляющий", "Бизнесмен", "Звезда инкогнито"],
    "Университет": ["Профессор", "Студент", "Декан", "Аспирант", "Уборщица", "Лаборант", "Абитуриент"],
    "Киностудия": ["Режиссёр", "Актёр", "Каскадёр", "Оператор", "Гримёр", "Продюсер", "Массовка"],
    "Зоопарк": ["Смотритель", "Ветеринар", "Посетитель", "Экскурсовод", "Продавец мороженого", "Фотограф", "Директор"],
    "Ночной клуб": ["Диджей", "Бармен", "Охранник", "Танцор", "Тусовщик", "Администратор", "Певица"],
    "Свадьба": ["Невеста", "Жених", "Тамада", "Тёща", "Фотограф", "Свидетель", "Пьяный гость"],
    "Стройка": ["Прораб", "Крановщик", "Сварщик", "Архитектор", "Разнорабочий", "Инспектор", "Электрик"],
    "Музей": ["Экскурсовод", "Смотрительница", "Реставратор", "Турист", "Директор", "Охранник", "Вор"],
    "Автосервис": ["Механик", "Клиент", "Мастер-приёмщик", "Шиномонтажник", "Маляр", "Владелец", "Стажёр"],
    "Полярная станция": ["Начальник станции", "Метеоролог", "Повар", "Геолог", "Врач", "Радист", "Биолог"],
    "Корпоратив": ["Директор", "Бухгалтер", "Новенький", "Ведущий", "Айтишник", "Секретарь", "Уборщик"],
    "Аэропорт": ["Пограничник", "Пилот", "Пассажир", "Таможенник", "Грузчик", "Диспетчер", "Опоздавший"],
    "Тюрьма": ["Надзиратель", "Заключённый", "Начальник тюрьмы", "Адвокат", "Повар", "Психолог", "Новенький"],
    "Ферма": ["Фермер", "Доярка", "Тракторист", "Ветеринар", "Агроном", "Внук фермера", "Покупатель"],
    "Бункер": ["Комендант", "Инженер", "Врач", "Повар", "Охранник", "Учёный", "Ребёнок"],
    "Пожарная часть": ["Начальник", "Пожарный", "Диспетчер", "Водитель", "Новобранец", "Инспектор", "Далматинец"],
  };
  const STD_NAMES = Object.keys(LOCATIONS);
  const MIN_P = 3, MAX_P = 12, MIN_T = 3, MAX_T = 15;

  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("ng-spy-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("ng-spy-" + k, JSON.stringify(v)); } catch {} },
  };

  let state = {
    screen: "setup",                       // setup → cover → card → hub → reveal
    players: store.get("players", 5),
    minutes: store.get("minutes", 8),
    custom: store.get("custom", false),
    customText: store.get("customText", "Кабинет физики\nСпортзал\nСтоловая\nКабинет директора\nАктовый зал"),
    game: null,                            // {location, roles[], spy, first, current, names[], useRoles}
    timer: { total: 0, left: 0, running: false },
    confirmReveal: false,
    confirmBack: false,
    error: "",
    caseNo: Math.floor(100 + Math.random() * 900),
  };
  let tick = null, wake = null, audio = null;

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const parseCustom = t => [...new Set(t.split(/[\n,;]+/).map(x => x.trim()).filter(Boolean))].slice(0, 100);

  function deal() {
    const names = state.custom ? parseCustom(state.customText) : STD_NAMES;
    if (names.length < 5) { state.error = `Нужно хотя бы 5 своих локаций, сейчас ${names.length}.`; render(); return; }
    const location = names[Math.floor(Math.random() * names.length)];
    const roles = LOCATIONS[location] && !state.custom ? shuffle(LOCATIONS[location].slice()) : [];
    const spy = Math.floor(Math.random() * state.players);
    state.game = {
      location, names, spy,
      roles: Array.from({ length: state.players }, (_, i) => i === spy ? null : (roles.length ? roles[i % roles.length] : "")),
      first: Math.floor(Math.random() * state.players),
      current: 0,
    };
    stopTimer();
    state.timer = { total: state.minutes * 60, left: state.minutes * 60, running: false };
    state.confirmReveal = false;
    state.error = "";
    state.caseNo = Math.floor(100 + Math.random() * 900);
    go("cover");
  }

  function go(screen) { state.screen = screen; state.confirmBack = false; render(); window.scrollTo(0, 0); }

  // «Назад»: никогда не возвращает к уже показанной карточке
  function back() {
    const g = state.game;
    if (state.screen === "card") return go("cover");                     // скрыть карточку, тот же игрок
    if (state.screen === "cover" && g && g.current === 0) return go("setup");
    if (state.screen === "reveal") return go("setup");
    if (state.screen === "cover" || state.screen === "hub") {            // идёт игра — спросить
      state.confirmBack = true; render(); window.scrollTo(0, 0); return;
    }
  }

  // ---------- таймер
  function startTimer() {
    if (state.timer.left <= 0) return;
    state.timer.running = true;
    state.timer.endAt = Date.now() + state.timer.left * 1000;
    try { navigator.wakeLock?.request("screen").then(l => { wake = l; }).catch(() => {}); } catch {}
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    clearInterval(tick);
    tick = setInterval(() => {
      state.timer.left = Math.max(0, Math.round((state.timer.endAt - Date.now()) / 1000));
      if (state.timer.left === 0) { stopTimer(); alarm(); }
      updateTimer();
    }, 250);
    render();
  }
  function stopTimer() {
    clearInterval(tick); tick = null;
    state.timer.running = false;
    try { wake?.release(); } catch {} wake = null;
  }
  function alarm() {
    try { navigator.vibrate?.([300, 120, 300, 120, 600]); } catch {}
    try {
      if (!audio) return;
      [0, .35, .7].forEach(t => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, audio.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.3, audio.currentTime + t + .02);
        g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t + .28);
        o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .3);
      });
    } catch {}
    render();
  }
  function updateTimer() {
    const el = document.getElementById("clock");
    if (!el) return;
    el.textContent = state.timer.left > 0 ? fmt(state.timer.left) : "0:00";
    const bar = document.getElementById("bar");
    const C = 2 * Math.PI * 100;
    bar.style.strokeDashoffset = String(C * (1 - state.timer.left / state.timer.total));
    if (state.timer.left === 0) document.getElementById("timer").classList.add("done");
  }

  // ---------- экраны
  const head = sub => `
    <div class="brand">
      <div class="brand-left">
        ${state.screen !== "setup" ? `<button class="back" type="button" id="back" aria-label="Назад">← Назад</button>` : ""}
        <span class="name">Name Games</span>
      </div>
      <span class="case">${sub}</span>
    </div>
    ${state.confirmBack ? `
      <div class="confirm">
        <p>${state.screen === "hub" ? "Выйти в настройки? Текущая игра закончится." : "Прервать раздачу? Карточки раздадутся заново."}</p>
        <div class="row">
          <button class="btn" type="button" id="back-yes">Выйти</button>
          <button class="btn ghost" type="button" id="back-no">Остаться</button>
        </div>
      </div>` : ""}`;

  function vSetup() {
    const names = parseCustom(state.customText);
    return `
      ${head("Дело №" + state.caseNo)}
      <h1>Шпион<span class="dot">.</span></h1>
      <p class="lead">Все узнают, где находятся. Один — нет. Вычислите шпиона по вопросам, пока он не догадался, где вы.</p>
      <div>
        <div class="field">
          <div class="label">Игроков<small>от ${MIN_P} до ${MAX_P}</small></div>
          <div class="stepper">
            <button type="button" id="p-minus" aria-label="Меньше игроков">−</button>
            <output id="p-out">${state.players}</output>
            <button type="button" id="p-plus" aria-label="Больше игроков">+</button>
          </div>
        </div>
        <div class="field">
          <div class="label">Таймер раунда<small>минут на вопросы</small></div>
          <div class="stepper">
            <button type="button" id="t-minus" aria-label="Меньше минут">−</button>
            <output id="t-out">${state.minutes}</output>
            <button type="button" id="t-plus" aria-label="Больше минут">+</button>
          </div>
        </div>
        <div class="field">
          <div class="label">Локации</div>
          <div class="seg" role="group" aria-label="Набор локаций">
            <button type="button" id="set-std" aria-pressed="${!state.custom}">Стандартные</button>
            <button type="button" id="set-own" aria-pressed="${state.custom}">Свои</button>
          </div>
        </div>
      </div>
      ${state.custom ? `
        <div>
          <textarea id="custom" aria-label="Свои локации, каждая с новой строки">${esc(state.customText)}</textarea>
          <p class="hint">Каждая локация с новой строки или через запятую. Сейчас: ${names.length}, нужно минимум 5. Ролей у своих локаций нет.</p>
        </div>` : `<p class="hint">${STD_NAMES.length} локаций с ролями: больница, казино, пиратский корабль, полярная станция и другие.</p>`}
      ${state.error ? `<p class="hint err">${esc(state.error)}</p>` : ""}
      <div class="spacer"></div>
      <button class="btn" type="button" id="deal">Раздать карточки</button>`;
  }

  function vCover() {
    const g = state.game;
    return `
      ${head("Дело №" + state.caseNo)}
      <div class="cover">
        <span class="eyebrow">Передайте телефон</span>
        <div class="who">${g.current + 1}<span> / ${state.players}</span></div>
        <p>Игрок ${g.current + 1}, ваша очередь. Остальные — отвернитесь и не подглядывайте.</p>
      </div>
      <button class="btn" type="button" id="open">Открыть карточку</button>`;
  }

  function vCard() {
    const g = state.game, i = g.current, isSpy = i === g.spy;
    const body = isSpy ? `
        <div class="stamp">Совершенно секретно</div>
        <p class="k">Ваша роль</p>
        <p class="v">Вы — шпион</p>
        <p class="k">Локация</p>
        <p class="v role"><span class="redact">████████████</span></p>
        <p class="note">Вы не знаете, где все. Слушайте ответы, не выдайте себя и попробуйте угадать локацию.</p>` : `
        <div class="stamp">Секретно</div>
        <p class="k">Локация</p>
        <p class="v">${esc(g.location)}</p>
        ${g.roles[i] ? `<p class="k">Ваша роль</p><p class="v role">${esc(g.roles[i])}</p>` : ""}
        <p class="note">Отвечайте так, чтобы свои поняли, а шпион — нет. Локацию вслух не называйте.</p>`;
    return `
      ${head("Дело №" + state.caseNo)}
      <div class="card-wrap">
        <article class="card${isSpy ? " spy" : ""}">
          <div class="meta"><span>Агент ${i + 1} из ${state.players}</span><span>Лист ${String(i + 1).padStart(2, "0")}</span></div>
          ${body}
        </article>
      </div>
      <button class="btn ghost" type="button" id="hide">Запомнил(а) — скрыть карточку</button>`;
  }

  function vHub() {
    const g = state.game, t = state.timer, C = 2 * Math.PI * 100;
    const offset = C * (1 - t.left / t.total);
    return `
      ${head("Дело №" + state.caseNo)}
      <div class="first">
        <span class="n">${g.first + 1}</span>
        <p>Первым спрашивает игрок ${g.first + 1}<small>Задайте вопрос любому игроку о локации</small></p>
      </div>
      <div class="timer${t.left === 0 ? " done" : ""}" id="timer">
        <svg viewBox="0 0 240 240" role="img" aria-label="Таймер раунда">
          <circle class="track" cx="120" cy="120" r="100"></circle>
          <circle class="bar" id="bar" cx="120" cy="120" r="100" stroke-dasharray="${C}" style="stroke-dashoffset:${offset}"></circle>
          <text class="clock" id="clock" x="120" y="126" text-anchor="middle">${fmt(t.left)}</text>
          <text class="sub" x="120" y="156" text-anchor="middle">${t.left === 0 ? "ГОЛОСОВАНИЕ" : t.running ? "ИДЁТ РАУНД" : "ПАУЗА"}</text>
        </svg>
      </div>
      <div class="row">
        <button class="btn${t.running ? " quiet" : ""}" type="button" id="timer-toggle" ${t.left === 0 ? "disabled" : ""}>${t.running ? "Пауза" : t.left === t.total ? "Старт" : "Продолжить"}</button>
        <button class="btn ghost" type="button" id="timer-reset">Сбросить</button>
      </div>
      <div>
        <details>
          <summary>Возможные локации · ${g.names.length}</summary>
          <div class="chips">${g.names.map(n => `<span class="chip">${esc(n)}</span>`).join("")}</div>
        </details>
        <details>
          <summary>Как играть</summary>
          <ol class="rules">
            <li><b>Вопросы по кругу.</b> Ответивший спрашивает следующего, но не того, кто только что спросил его.</li>
            <li><b>Голосование в любой момент.</b> Если все, кроме обвиняемого, согласны — он открывает карточку.</li>
            <li><b>Поймали шпиона?</b> У него последний шанс назвать локацию. Угадал — победа шпиона.</li>
            <li><b>Шпион может раскрыться сам</b> и назвать локацию: угадал — победил, ошибся — проиграл.</li>
            <li><b>Время вышло</b> — финальное голосование.</li>
          </ol>
        </details>
      </div>
      ${state.confirmReveal ? `
        <div class="confirm">
          <p>Раскрыть шпиона и локацию? Игра закончится.</p>
          <div class="row">
            <button class="btn" type="button" id="reveal-yes">Раскрыть</button>
            <button class="btn ghost" type="button" id="reveal-no">Отмена</button>
          </div>
        </div>` : `<button class="btn ghost" type="button" id="reveal">Раскрыть шпиона и локацию</button>`}`;
  }

  function vReveal() {
    const g = state.game;
    return `
      ${head("Дело №" + state.caseNo + " · закрыто")}
      <h1>Итоги<span class="dot">.</span></h1>
      <div class="result">
        <section><div class="lbl">Локация</div><p class="big">${esc(g.location)}</p></section>
        <section><div class="lbl">Шпион</div><p class="big">Игрок ${g.spy + 1}</p></section>
      </div>
      <div class="spacer"></div>
      <button class="btn" type="button" id="again">Новая игра</button>
      <button class="btn ghost" type="button" id="settings">Изменить настройки</button>`;
  }

  // ---------- отрисовка и кнопки
  function render() {
    const views = { setup: vSetup, cover: vCover, card: vCard, hub: vHub, reveal: vReveal };
    app.innerHTML = `<main class="screen">${views[state.screen]()}</main>`;
    bind();
    try {
      const tgBack = window.Telegram?.WebApp?.BackButton;
      if (tgBack) state.screen === "setup" ? tgBack.hide() : tgBack.show();
    } catch {}
  }

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };

  function bind() {
    on("back", back);
    on("back-no", () => { state.confirmBack = false; render(); });
    on("back-yes", () => { stopTimer(); go("setup"); });
    on("p-minus", () => { state.players = Math.max(MIN_P, state.players - 1); store.set("players", state.players); render(); });
    on("p-plus", () => { state.players = Math.min(MAX_P, state.players + 1); store.set("players", state.players); render(); });
    on("t-minus", () => { state.minutes = Math.max(MIN_T, state.minutes - 1); store.set("minutes", state.minutes); render(); });
    on("t-plus", () => { state.minutes = Math.min(MAX_T, state.minutes + 1); store.set("minutes", state.minutes); render(); });
    on("set-std", () => { state.custom = false; state.error = ""; store.set("custom", false); render(); });
    on("set-own", () => { state.custom = true; store.set("custom", true); render(); });
    const ta = document.getElementById("custom");
    if (ta) ta.addEventListener("input", () => {
      state.customText = ta.value; store.set("customText", ta.value);
      const n = parseCustom(ta.value).length;
      ta.nextElementSibling.textContent = `Каждая локация с новой строки или через запятую. Сейчас: ${n}, нужно минимум 5. Ролей у своих локаций нет.`;
    });
    on("deal", deal);
    on("open", () => go("card"));
    on("hide", () => {
      state.game.current += 1;
      go(state.game.current < state.players ? "cover" : "hub");
    });
    on("timer-toggle", () => { state.timer.running ? (stopTimer(), render()) : startTimer(); });
    on("timer-reset", () => { stopTimer(); state.timer.left = state.timer.total; render(); });
    on("reveal", () => { state.confirmReveal = true; render(); });
    on("reveal-no", () => { state.confirmReveal = false; render(); });
    on("reveal-yes", () => { stopTimer(); go("reveal"); });
    on("again", deal);
    on("settings", () => go("setup"));
  }

  // внутри Telegram (Mini App) — разворачиваемся на весь экран
  try {
    window.Telegram?.WebApp?.ready();
    window.Telegram?.WebApp?.expand();
    window.Telegram?.WebApp?.BackButton?.onClick(back);
  } catch {}

  // сохранение состояния при обновлении страницы просмотрщиком
  window.claude?.hot?.snapshot?.(() => ({ state: { ...state, timer: { ...state.timer, running: false } } }));
  const start = data => {
    if (data && data.state) state = { ...state, ...data.state };
    render();
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
